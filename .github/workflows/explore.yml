name: explore (temporary)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          pip install -q requests
          python - <<'PY'
          import json, time, requests
          Q = """[out:json][timeout:120];
          (relation["boundary"="administrative"]["admin_level"="6"]["name"~"^City of (Cockburn|Fremantle|Kwinana)$"];)->.r;
          .r out geom;
          way["man_made"="pier"](-32.135,115.745,-32.115,115.775); out geom tags;"""
          for u in 2*["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://overpass.private.coffee/api/interpreter"]:
              try:
                  r = requests.post(u, data={"data": Q}, timeout=180, headers={"User-Agent": "wa-fishing-intelligence/0.6 (one-off boundary extract via GitHub Actions)"}); r.raise_for_status(); d = r.json(); break
              except Exception as e: print("fail", u, e); time.sleep(20)
          out = []
          for el in d["elements"]:
              if el["type"] == "relation":
                  ways = [{"role": m.get("role"), "g": [[round(p["lon"],6), round(p["lat"],6)] for p in m.get("geometry", [])]} for m in el["members"] if m["type"] == "way"]
                  out.append({"type": "relation", "name": el["tags"].get("name"), "ways": ways})
              else:
                  out.append({"type": "way", "id": el["id"], "tags": el.get("tags", {}), "g": [[round(p["lon"],6), round(p["lat"],6)] for p in el.get("geometry", [])]})
          json.dump(out, open("/tmp/lga.json", "w"))
          print("elements", [(o["type"], o.get("name") or o["tags"].get("name")) for o in out])
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan explore-out; git rm -rq --cached . ; cp /tmp/lga.json lga.json; git add lga.json; git commit -qm out; git push -f origin explore-out
