name: explore (temporary)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  x:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install -q requests
      - run: python pipeline/fetch_zones.py /tmp/marine-parks.geojson
      - run: |
          python - <<'PY'
          import json, time, requests
          UA = {"User-Agent": "wa-fishing-intelligence/0.6 (one-off extract via GitHub Actions)"}
          out = {}
          for key, q in [("clifton", "Lake Clifton, Western Australia"), ("yallingup_brook", "Yallingup Brook"), ("heirisson", "Heirisson Island, Perth")]:
              try:
                  r = requests.get("https://nominatim.openstreetmap.org/search", params={"q": q, "format": "geojson", "polygon_geojson": 1, "limit": 5}, headers=UA, timeout=60)
                  out[key] = r.json(); print(key, [(f["properties"].get("display_name","")[:60], f["properties"].get("category"), f["properties"].get("type"), f["geometry"]["type"]) for f in out[key].get("features", [])])
              except Exception as e: print("nominatim fail", key, e)
              time.sleep(2)
          Q = '[out:json][timeout:60];(way["natural"="water"](-31.9665,115.873,-31.953,115.889);relation["natural"="water"](-31.9665,115.873,-31.953,115.889);way["waterway"](-33.648,115.020,-33.636,115.040););out geom tags;'
          for u in ["https://overpass-api.de/api/interpreter", "https://maps.mail.ru/osm/tools/overpass/api/interpreter", "https://overpass.private.coffee/api/interpreter", "https://overpass.kumi.systems/api/interpreter"]:
              try:
                  r = requests.post(u, data={"data": Q}, headers=UA, timeout=90); r.raise_for_status(); out["overpass"] = r.json(); print("overpass ok", u, len(out["overpass"]["elements"])); break
              except Exception as e: print("overpass fail", u, e)
          json.dump(out, open("/tmp/places.json", "w"))
          PY
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan explore-out; git rm -rq --cached . ; cp /tmp/marine-parks.geojson /tmp/places.json .; git add marine-parks.geojson places.json; git commit -qm out; git push -f origin explore-out
