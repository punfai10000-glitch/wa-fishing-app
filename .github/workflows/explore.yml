name: explore
on: workflow_dispatch
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          for u in "https://www.wa.gov.au/system/files/2024-07/prohibition_on_recreational_fishing_jurien_bay_marine_park_order_2005.pdf" "https://www.wa.gov.au/system/files/2024-07/houtman_abrolhos_reef_observation_areas_notice_1994.pdf" "https://www.wa.gov.au/system/files/2021-08/Lancelin%20Island%20Lagoon%20Fish%20Habitat%20Protection%20Area%20Order%202001.pdf" "https://www.wa.gov.au/system/files/2024-07/prohibition_taking_samson_fish_or_yellowtail_kingfish_houtman_abrolhos_notice_1995.pdf" "https://www.wa.gov.au/system/files/2024-07/prohibition_on_fishing_for_rock_lobster_seven_mile_beach_order_2014.pdf"; do
            echo "=========== $u"; curl -sL -A "Mozilla/5.0" -o o.pdf "$u"; pdftotext -layout o.pdf - | grep -v "^\s*$" | sed 's/  */ /g' | grep -v -i "^ *[0-9]* *°\|’ *[SE]\b" | head -170
          done
