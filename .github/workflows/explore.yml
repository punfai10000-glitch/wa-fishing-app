name: explore
on: workflow_dispatch
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - run: |
          L=$(curl -s --max-time 60 ftp://ftp.bom.gov.au/anon/gen/fwo/ | awk '{print $NF}' | grep -E '^IDW1[01][0-9]{3}\.txt$')
          for f in $L; do echo "=== $f"; curl -s --max-time 20 ftp://ftp.bom.gov.au/anon/gen/fwo/$f | grep -v '^\s*$' | head -14; done
          for t in J1 J2; do curl -s --max-time 60 "https://cmr.earthdata.nasa.gov/search/granules.json?short_name=VIIRS${t}_L3m_KD_NRT&sort_key=-start_date&page_size=4" | python3 -c "import json,sys;[print(e['producer_granule_id'],[l['href'] for l in e['links'] if l['href'].endswith('.nc')][:1]) for e in json.load(sys.stdin)['feed']['entry']]"; done
