name: explore
on: workflow_dispatch
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://coastwatch.noaa.gov/erddap/search/index.csv?searchFor=kd490&itemsPerPage=30" "https://coastwatch.pfeg.noaa.gov/erddap/search/index.csv?searchFor=kd490%20daily&itemsPerPage=30"; do
            echo "== $u"; curl -sL -A "Mozilla/5.0" -w "\nHTTP %{http_code}\n" "$u" | cut -d, -f1-20 | grep -iE "kd490|K490|HTTP" | cut -c1-260 | head -30; done
          curl -s "https://thredds.aodn.org.au/thredds/catalog/IMOS/SRS/OC/gridded/noaa20/catalog.xml" | grep -oE 'xlink:href="[^"]+"' | head
          curl -s "https://thredds.aodn.org.au/thredds/catalog/IMOS/SRS/OC/gridded/noaa20/P1D/2026/11/catalog.xml" | grep -oE 'urlPath="[^"]+K_490[^"]*"' | tail -3
          curl -s "https://thredds.aodn.org.au/thredds/catalog/IMOS/SRS/OC/gridded/contributed/catalog.xml" | grep -oE 'xlink:href="[^"]+"' | head
