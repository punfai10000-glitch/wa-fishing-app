name: explore
on: workflow_dispatch
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - name: capad
        run: |
          L=https://gis.environment.gov.au/gispubmap/rest/services/ogc_services/CAPAD/FeatureServer/1
          curl -s "$L/query?where=NAME+LIKE+%27%25Mamang%25%27+OR+NAME+LIKE+%27%25Wudjari%25%27+OR+NAME+LIKE+%27%25South+Coast%25%27&outFields=NAME,TYPE,ZONE_TYPE,IUCN,GAZ_DATE,LATEST_GAZ&returnGeometry=false&f=json" | head -c 2500; echo
          curl -s "$L?f=json" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('name'),d.get('description','')[:300]);print([f['name'] for f in d.get('fields',[])])"
      - name: slip dbca011
        run: |
          S=https://public-services.slip.wa.gov.au/public/rest/services/SLIP_Public_Services/Property_and_Planning/MapServer/15
          curl -s "$S/query?where=1%3D1&geometry=118.5,-35.0,124.5,-33.0&geometryType=esriGeometryEnvelope&inSR=4326&outFields=*&returnGeometry=false&f=json" | python3 -c "
          import json,sys;d=json.load(sys.stdin);fs=d.get('features',[]);print(len(fs))
          seen=set()
          for f in fs:
            a=f['attributes']; k=str({x:a[x] for x in a if any(t in x.lower() for t in ['name','categ','type','class','zone'])})
            if 'arine' in k and k not in seen: seen.add(k); print(k)
          " || true
      - name: osm
        run: |
          curl -s --data-urlencode 'data=[out:json][timeout:60];(relation["name"~"Mamang|Wudjari|Western Bight|Mirning"];way["name"~"Mamang|Wudjari"];relation["protection_title"~"Sanctuary",i](-35.2,118.5,-33.5,124.5););out tags;' https://overpass-api.de/api/interpreter | python3 -c "import json,sys;d=json.load(sys.stdin);[print(e['type'],e['id'],{k:v for k,v in e['tags'].items() if k in ('name','boundary','protect_class','protection_title','leisure','start_date')}) for e in d['elements']]"
