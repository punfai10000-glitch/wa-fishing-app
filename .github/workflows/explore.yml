name: explore
on: workflow_dispatch
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U="https://public-services.slip.wa.gov.au/public/rest/services/SLIP_Public_Services/Locate/MapServer/export?bbox=12882000,-3758000,12883200,-3756800&bboxSR=3857&imageSR=3857&size=512,512&format=jpg&transparent=false&f=image"
          for i in 1 2 3; do curl -s -o t.jpg -w "aerial http=%{http_code} type=%{content_type} size=%{size_download} time=%{time_total}\n" -H "Referer: https://punfai10000-glitch.github.io/" "$U"; done
          file t.jpg; head -c 300 t.jpg | strings | head -5
          curl -s "https://public-services.slip.wa.gov.au/public/rest/services/SLIP_Public_Services/Locate/MapServer?f=json" | head -c 1500; echo
          curl -s -o /dev/null -w "eox z15 http=%{http_code} size=%{size_download}\n" "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2024_3857/default/g/15/19300/26700.jpg"
          echo GERALDTON_TIDE; curl -s "https://marine-api.open-meteo.com/v1/marine?latitude=-28.79&longitude=114.56&hourly=sea_level_height_msl&past_days=61&forecast_days=16&timezone=Australia%2FPerth&cell_selection=sea" | gzip | base64 -w0; echo
          echo IOC; curl -s "https://www.ioc-sealevelmonitoring.org/service.php?query=stationlist&showall=all" | tr '}' '\n' | grep -i -E "gera|geraldton|jurien" | head
