name: Live data (measured buoys + weather stations)
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  buoys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install netCDF4
      - run: python pipeline/fetch_buoys.py out || echo "buoys failed"
      - run: python pipeline/fetch_bom_obs.py out || echo "BOM failed"
      - run: ls -la out && test -n "$(ls out/*.json 2>/dev/null)"
      - name: Publish to live-data branch
        run: |
          cd out
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -qm "Live data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live-data
