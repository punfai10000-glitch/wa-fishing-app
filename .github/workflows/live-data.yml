name: Live data (measured buoys + weather stations)
on:
  schedule:
    - cron: '17 * * * *'   # hourly (GitHub may delay runs)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  buoys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install netCDF4
      - run: python pipeline/fetch_buoys.py out || echo "buoys failed"
      - run: python pipeline/fetch_bom_obs.py out || echo "BOM failed"
      - run: python pipeline/fetch_tides.py out || echo "tides failed"
      - run: python pipeline/fetch_clarity.py out || echo "clarity failed"
      - run: python pipeline/fetch_coast_forecast.py out || echo "coast forecast failed"
      - run: ls -la out && test -n "$(ls out/*.json 2>/dev/null)"
      - name: Publish to live-data branch (single commit, no history growth)
        run: |
          cd out
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -qm "Live data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live-data
