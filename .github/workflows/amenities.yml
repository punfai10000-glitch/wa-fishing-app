name: Weekly data (shops, servos, toilets, community posts, marine zones)
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      # One OpenStreetMap download from Geofabrik (free mirror), cut to Perth->Esperance and read locally.
      # The public Overpass servers time out from GitHub, so they're only a fallback if this step fails.
      - name: Download OpenStreetMap extract (Geofabrik)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -sSfL --retry 3 -o au.osm.pbf https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf
          osmium extract -b 113.4,-35.6,124.5,-28.3 au.osm.pbf -o sw.osm.pbf --overwrite
          rm -f au.osm.pbf
          ls -la sw.osm.pbf
          echo "OSM_PBF=$PWD/sw.osm.pbf" >> "$GITHUB_ENV"
      - run: python pipeline/fetch_amenities.py || echo "amenities failed"
      - run: python pipeline/fetch_osm_spots.py || echo "spots failed"
      - run: python pipeline/fetch_coastline.py || echo "coastline failed"
      - run: python pipeline/fetch_zones.py || echo "zones failed"
      - run: python pipeline/fetch_community.py data/community.json || echo "community failed"
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Weekly data update"
          git pull --rebase -X theirs origin main
          git push
