name: Nearshore habitat estimate (quarterly)
on:
  schedule: [{ cron: '23 20 9 */3 *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  est:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install pillow numpy scipy scikit-learn
      - run: python pipeline/fetch_nearshore_habitat.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/habitat-est
          git diff --cached --quiet && exit 0
          git commit -m "Nearshore habitat estimate update"
          git pull --rebase -X theirs origin main
          git push
